<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — blog-crud-app</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topnav">
  <div class="logo">logo</div>
  <div class="links">
    <a href="/" class="active">home</a>
    <a href="/blog.html?id=blog-1">my blog</a>
    <a href="/messages.html">messages</a>
  </div>
  <div class="right">
    <input type="search" placeholder="search">
    <div class="avatar">y</div>
  </div>
</div>

<div class="layout">
  <div class="col-left">
    <div class="card">
      <div class="blog-summary">
        <div class="avatar" style="width:34px;height:34px">y</div>
        <div>
          <div class="name">your blog</div>
        </div>
      </div>
      <div class="stats" id="my-stats"></div>
    </div>

    <div class="card" id="your-blogs-card">
      <h3>your blogs</h3>
      <div id="your-blogs-list"></div>
    </div>

    <div class="card dashed" id="tags-card">
      <h3>followed tags</h3>
      <div class="tag-row" id="tags-list"></div>
    </div>
  </div>

  <div class="col-center">
    <form class="composer" id="composer">
      <div class="row">
        <div class="avatar">y</div>
        <input type="text" id="composer-title" placeholder="what's on your mind?">
      </div>
      <textarea id="composer-body" placeholder="write something…"></textarea>
      <input type="text" id="composer-tags" placeholder="tags, comma separated">
      <div class="types">
        <button type="button" data-type="text" class="selected">text</button>
        <button type="button" data-type="photo">photo</button>
        <button type="button" data-type="photoset">photoset</button>
        <button type="button" data-type="link">link</button>
        <button type="button" data-type="video">video</button>
      </div>
      <div class="submit-row">
        <button type="submit" class="post-btn">post</button>
      </div>
    </form>

    <div id="feed"></div>
  </div>

  <div class="col-right">
    <div class="card dashed">
      <h3>check out these blogs</h3>
      <div id="other-blogs-list"></div>
    </div>
    <div class="card dashed">
      <h3>trending tags</h3>
      <div class="tag-row" id="trending-tags"></div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
